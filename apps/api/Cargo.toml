[package]
name = "adoc-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.adoc]
layer = "app"

[dependencies]
adoc-adapters.workspace = true
adoc-application.workspace = true
adoc-configuration.workspace = true
adoc-telemetry.workspace = true
axum = "0.8.4"
chrono = "0.4.42"
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1.25.0", features = ["v7"] }

[dev-dependencies]
serde_json = "1.0.149"
tempfile = "3.27.0"
