name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.90.0
          components: clippy,rustfmt

      - name: Install JavaScript dependencies
        run: bun ci

      - name: Verify repository
        run: bun run ci

      - name: Audit Rust dependencies
        uses: actions-rust-lang/audit@v1
        with:
          denyWarnings: true
          createIssues: false
          ignore: RUSTSEC-2023-0071

      - name: Audit JavaScript dependencies
        run: bun audit --audit-level high

      - name: Verify provenance and production-readiness contracts
        run: node scripts/check-provenance.mjs --self-test && bun run check:production-readiness

      - name: Verify full acceptance in containers
        run: bun run compose:integration

      - name: Verify browser acceptance and accessibility
        run: bun run browser:check
