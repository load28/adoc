        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/ai/configuration:
    get:
      tags: [AI]
      operationId: getAIConfiguration
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200': {description: Configuration, content: {application/json: {schema: {$ref: '#/components/schemas/AIConfiguration'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [AI]
      operationId: updateAIConfiguration
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateAIConfiguration'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/AIConfiguration'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/ai/usage:
    get:
      tags: [AI]
      operationId: getAIUsage
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: Usage, content: {application/json: {schema: {$ref: '#/components/schemas/AIUsage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/ai/provider-health:
    get:
      tags: [AI]
      operationId: getAIProviderHealth
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200': {description: Health without credentials, content: {application/json: {schema: {$ref: '#/components/schemas/AIProviderHealth'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/public-links:
    get:
      tags: [Governance]
      operationId: listPublicLinks
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}]
      responses:
        '200': {description: Links without secret tokens, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/PublicLink'}}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Governance]
      operationId: createPublicLink
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, properties: {expiresAt: {type: [string, 'null'], format: date-time}}}}}
      responses:
        '201': {description: Token shown once, content: {application/json: {schema: {$ref: '#/components/schemas/PublicLinkCreated'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/public-links/{linkId}:
    delete:
      tags: [Governance]
      operationId: revokePublicLink
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/LinkId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Revoked}
        default: {$ref: '#/components/responses/Problem'}
  /stream:
    get:
      tags: [Workspace]
      operationId: openWorkspaceStream
      parameters:
        - {name: workspaceId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        '200': {description: Permission-filtered resumable SSE stream, headers: {Cache-Control: {schema: {type: string, const: 'no-cache, no-store'}}, X-Accel-Buffering: {schema: {type: string, const: 'no'}}}, content: {text/event-stream: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Problem'}
  /public/v1/documents/{token}:
    get:
      tags: [Document]
      security: []
      servers: [{url: /}]
      operationId: getPublicDocument
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, minLength: 43, maxLength: 43}}
      responses:
        '200': {description: Latest published document only, content: {application/json: {schema: {$ref: '#/components/schemas/PublicDocument'}}}}
        '404': {description: 'Unknown, revoked, expired, trashed or unpublished'}
components:
  securitySchemes:
    sessionCookie: {type: apiKey, in: cookie, name: adoc_session}
  parameters:
    WorkspaceId: {name: workspaceId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    DocumentId: {name: documentId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ReviewId: {name: reviewId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    JobId: {name: jobId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ProposalId: {name: proposalId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    UserId: {name: userId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    InvitationId: {name: invitationId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    GroupId: {name: groupId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    GrantId: {name: grantId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    VersionId: {name: versionId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    DiscussionId: {name: discussionId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    TopicId: {name: topicId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    MessageId: {name: messageId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ItemId: {name: itemId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ReferenceId: {name: referenceId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    ConceptId: {name: conceptId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    AssetId: {name: assetId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    LinkId: {name: linkId, in: path, required: true, schema: {$ref: '#/components/schemas/Id'}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 2048}}
    StatusFilter: {name: status, in: query, schema: {type: string, enum: [UNREAD, ACTIONABLE, RESOLVED, ALL]}}
    Range: {name: Range, in: header, schema: {type: string, pattern: '^bytes=([0-9]+-[0-9]*|-[0-9]+)$'}}
