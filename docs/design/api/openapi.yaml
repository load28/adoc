openapi: 3.1.0
x-document-id: API-02
info:
  title: Team Document Internal API
  version: 1.0.0
  description: Browser-facing internal contract. Not a customer Public API.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
tags:
  - name: Workspace
  - name: Governance
  - name: Document
  - name: Collaboration
  - name: Knowledge
  - name: AI
  - name: Operations
paths:
  /session:
    get:
      tags: [Workspace]
      operationId: getSession
      responses:
        '200': {description: Session, content: {application/json: {schema: {$ref: '#/components/schemas/SessionView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /auth/google/start:
    get:
      tags: [Workspace]
      security: []
      operationId: beginGoogleLogin
      parameters: [{name: returnTo, in: query, schema: {type: string, maxLength: 2048}}]
      responses:
        '302': {description: Google authorization redirect, headers: {Location: {schema: {type: string, format: uri}}}}
        default: {$ref: '#/components/responses/Problem'}
  /auth/google/callback:
    get:
      tags: [Workspace]
      security: []
      operationId: completeGoogleLogin
      parameters:
        - {name: code, in: query, required: true, schema: {type: string}}
        - {name: state, in: query, required: true, schema: {type: string}}
      responses:
        '302': {description: Validated application redirect, headers: {Location: {schema: {type: string}}}}
        default: {$ref: '#/components/responses/Problem'}
  /session/logout:
    post:
      tags: [Workspace]
      operationId: logout
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Session revoked}
        default: {$ref: '#/components/responses/Problem'}
  /preferences:
    get:
      tags: [Workspace]
      operationId: getUserPreferences
      responses:
        '200': {description: Preferences, content: {application/json: {schema: {$ref: '#/components/schemas/UserPreferences'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Workspace]
      operationId: updateUserPreferences
      parameters: [{$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateUserPreferences'}
      responses:
        '200': {description: Preferences, content: {application/json: {schema: {$ref: '#/components/schemas/UserPreferences'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces:
    get:
      tags: [Workspace]
      operationId: listWorkspaces
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Workspace'}}}}}
    post:
      tags: [Workspace]
      operationId: createWorkspace
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/CreateWorkspace'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}:
    get:
      tags: [Workspace]
      operationId: getWorkspace
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200': {description: Workspace, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Workspace]
      operationId: updateWorkspace
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateWorkspace'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/deletion:
    post:
      tags: [Workspace]
      operationId: scheduleWorkspaceDeletion
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {description: Scheduled, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Workspace]
      operationId: cancelWorkspaceDeletion
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '200': {description: Cancelled, content: {application/json: {schema: {$ref: '#/components/schemas/Workspace'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/members:
    get:
      tags: [Governance]
      operationId: listMembers
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Membership'}}}}}
  /workspaces/{workspaceId}/members/{userId}/role:
    put:
      tags: [Governance]
      operationId: updateMemberRole
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateMemberRole'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Membership'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/members/{userId}:
    delete:
      tags: [Governance]
      operationId: removeMember
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '200': {description: Removed, content: {application/json: {schema: {$ref: '#/components/schemas/Membership'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/invitations:
    get:
      tags: [Governance]
      operationId: listInvitations
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Invitations, content: {application/json: {schema: {$ref: '#/components/schemas/InvitationPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Governance]
      operationId: inviteMember
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/InviteMember'}
      responses:
        '201': {description: Invitation created, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/invitations/{invitationId}:
    delete:
      tags: [Governance]
      operationId: revokeInvitation
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/InvitationId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '200': {description: Revoked, content: {application/json: {schema: {$ref: '#/components/schemas/Invitation'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /invitations/{token}/accept:
    post:
      tags: [Governance]
      operationId: acceptInvitation
      parameters:
        - {name: token, in: path, required: true, schema: {type: string, minLength: 32}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/CsrfToken'}
      responses:
        '201': {description: Membership, content: {application/json: {schema: {$ref: '#/components/schemas/Membership'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/groups:
    get:
      tags: [Governance]
      operationId: listGroups
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Group'}}}}}
    post:
      tags: [Governance]
      operationId: createGroup
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, additionalProperties: false, required: [name], properties: {name: {type: string, minLength: 1, maxLength: 200}, memberIds: {type: array, uniqueItems: true, maxItems: 1000, items: {$ref: '#/components/schemas/Id'}}}}}}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Group'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/groups/{groupId}:
    get:
      tags: [Governance]
      operationId: getGroup
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/GroupId'}]
      responses:
        '200': {description: Group, content: {application/json: {schema: {$ref: '#/components/schemas/Group'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Governance]
      operationId: updateGroup
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/GroupId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateGroup'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Group'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Governance]
      operationId: deleteGroup
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/GroupId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Deleted}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/groups/{groupId}/members/{userId}:
    put:
      tags: [Governance]
      operationId: addGroupMember
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/GroupId'}, {$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Group'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Governance]
      operationId: removeGroupMember
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/GroupId'}, {$ref: '#/components/parameters/UserId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Group'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents:
    post:
      tags: [Document]
      operationId: createDocument
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: {type: string, minLength: 1, maxLength: 500}
                parentId: {$ref: '#/components/schemas/NullableId'}
                afterDocumentId: {$ref: '#/components/schemas/NullableId'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/tree:
    get:
      tags: [Document]
      operationId: getDocumentTree
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}]
      responses:
        '200': {description: Permission-filtered tree, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentTree'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/trash:
    get:
      tags: [Document]
      operationId: listTrashedDocuments
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Trashed documents, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}:
    get:
      tags: [Document]
      operationId: getDocument
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentDetail'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Document]
      operationId: updateDocumentMetadata
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/UpdateDocumentMetadata'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Document]
      operationId: purgeDocument
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '202': {description: Purge accepted, content: {application/json: {schema: {$ref: '#/components/schemas/JobReference'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/trash:
    post:
      tags: [Document]
      operationId: trashDocument
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/Reason'}
      responses:
        '200': {description: Trashed, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/restore:
    post:
      tags: [Document]
      operationId: restoreDocument
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/RestoreDocument'}
      responses:
        '200': {description: Restored, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/move-preview:
    post:
      tags: [Document]
      operationId: previewDocumentMove
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/MoveDocument'}
      responses:
        '200': {description: Impact, content: {application/json: {schema: {$ref: '#/components/schemas/ImpactPreview'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/move:
    post:
      tags: [Document]
      operationId: moveDocument
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {allOf: [{$ref: '#/components/schemas/MoveDocumentInput'}, {type: object, required: [previewToken], properties: {previewToken: {type: string}}}]}}}
      responses:
        '200': {description: Moved, content: {application/json: {schema: {$ref: '#/components/schemas/Document'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/permissions:
    get:
      tags: [Governance]
      operationId: getDocumentPermissions
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/PermissionView'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/permissions/{grantId}:
    put:
      tags: [Governance]
      operationId: setDocumentPermission
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/GrantId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PermissionGrantInput'}}}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/PermissionGrant'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Governance]
      operationId: deleteDocumentPermission
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/GrantId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Deleted}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/permission-explanation:
    get:
      tags: [Governance]
      operationId: explainEffectivePermission
      parameters:
        - {$ref: '#/components/parameters/WorkspaceId'}
        - {$ref: '#/components/parameters/DocumentId'}
        - {name: subjectKind, in: query, required: true, schema: {type: string, enum: [USER, GROUP]}}
        - {name: subjectId, in: query, required: true, schema: {$ref: '#/components/schemas/Id'}}
      responses:
        '200': {description: Explanation, content: {application/json: {schema: {$ref: '#/components/schemas/PermissionExplanation'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/publish-policy:
    get:
      tags: [Governance]
      operationId: getPublishPolicy
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}]
      responses:
        '200': {description: Effective policy, content: {application/json: {schema: {$ref: '#/components/schemas/PublishPolicy'}}}}
        default: {$ref: '#/components/responses/Problem'}
    put:
      tags: [Governance]
      operationId: setPublishPolicy
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody: {$ref: '#/components/requestBodies/SetPublishPolicy'}
      responses:
        '200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/PublishPolicy'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/draft:
    get:
      tags: [Document]
      operationId: getDraft
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}]
      responses:
        '200': {description: Draft, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Document]
      operationId: createOrGetDraft
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '200': {description: Draft, content: {application/json: {schema: {$ref: '#/components/schemas/Draft'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/lease:
    post:
      tags: [Document]
      operationId: acquireEditLease
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [clientInstanceId], properties: {clientInstanceId: {$ref: '#/components/schemas/Id'}, force: {type: boolean, default: false}, reason: {type: string, maxLength: 500}}}}}
      responses:
        '200': {description: Lease, content: {application/json: {schema: {$ref: '#/components/schemas/EditLease'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Document]
      operationId: releaseEditLease
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/LeaseToken'}, {$ref: '#/components/parameters/ClientInstance'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '204': {description: Released}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/lease/renew:
    post:
      tags: [Document]
      operationId: renewEditLease
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/LeaseToken'}, {$ref: '#/components/parameters/ClientInstance'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '200': {description: Renewed, content: {application/json: {schema: {$ref: '#/components/schemas/EditLease'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/draft/operations:
    post:
      tags: [Document]
      operationId: applyDraftOperations
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/LeaseToken'}, {$ref: '#/components/parameters/ClientInstance'}, {$ref: '#/components/parameters/CsrfToken'}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [operations], properties: {operations: {type: array, minItems: 1, items: {$ref: '#/components/schemas/DocumentOperation'}}}}}}
      responses:
        '200': {description: Applied, content: {application/json: {schema: {$ref: '#/components/schemas/MutationResult'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/reviews:
    post:
      tags: [Collaboration]
      operationId: requestReview
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/IfMatch'}, {$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/CsrfToken'}]
      responses:
        '201': {description: Requested, content: {application/json: {schema: {$ref: '#/components/schemas/Review'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/versions:
    get:
      tags: [Document]
      operationId: listVersions
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/Cursor'}]
      responses:
        '200': {description: Versions, content: {application/json: {schema: {$ref: '#/components/schemas/VersionPage'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/versions/{versionId}:
    get:
      tags: [Document]
      operationId: getVersion
      parameters: [{$ref: '#/components/parameters/WorkspaceId'}, {$ref: '#/components/parameters/DocumentId'}, {$ref: '#/components/parameters/VersionId'}]
      responses:
        '200': {description: Version, content: {application/json: {schema: {$ref: '#/components/schemas/PublishedVersion'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /workspaces/{workspaceId}/documents/{documentId}/versions/{versionId}/restore:
    post:
      tags: [Document]
