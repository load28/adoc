    ImpactPreview: {type: object, additionalProperties: false, required: [previewToken, permissionChanges, policyChanges, expiresAt], properties: {previewToken: {type: string, minLength: 43, maxLength: 43}, permissionChanges: {type: integer, minimum: 0}, policyChanges: {type: integer, minimum: 0}, expiresAt: {type: string, format: date-time}}}
