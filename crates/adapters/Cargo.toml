[package]
name = "adoc-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.adoc]
layer = "adapters"

[dependencies]
adoc-application.workspace = true
adoc-ports.workspace = true
chrono = { version = "0.4.42", features = ["serde"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "migrate", "macros", "uuid", "chrono", "json"] }
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
