[package]
name = "adoc-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[package.metadata.adoc]
layer = "application"

[dependencies]
adoc-collaboration.workspace = true
adoc-document.workspace = true
adoc-governance.workspace = true
adoc-identity.workspace = true
adoc-kernel.workspace = true
adoc-knowledge.workspace = true
adoc-operations.workspace = true
adoc-ports.workspace = true
adoc-writing-intelligence.workspace = true
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
hmac = "0.12.1"
hex = "0.4.3"
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
thiserror = "2.0.20"
uuid = { version = "1.25.0", features = ["serde"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
